    <div class="titulo-contato">
        <h1 class="cor-contato fonte">Entre em contato conosco:</h1>
    </div>

    <form class="entre-em-contato form-esquerda fonte-form" action="http://localhost/post.php" method="POST" target="_blank">

        <div class="input">
            <label for="nome">Nome:</label>
            <input class="fonte" type="text" name="nome" id="Nome" placeholder="Seu nome completo" required>
        </div>

        <div class="input">
            <label for="cpf">CPF:</label>
            <input class="fonte" type="text" name="cpf" id="cpf" placeholder="Digite seu CPF" required>
        </div>

        <div class="input">
            <label for="email">E-mail:</label>
            <input class="fonte" type="email" name="email" id=email placeholder="Ex: ohmydog9@gmail.com" required>
        </div>

        <div class="input">
            <label for="telefone">Telefone:</label>
            <input class="fonte" type="tel" name="telefone" id="telefone" placeholder="Ex: 99 555-444" required>
        </div>

        <div class="input">
            <label for="assunto">Assunto:</label>
            <input class="fonte" type="text" name="assunto" id="assunto" placeholder="Digite aqui o assunto!" required>
        </div>

        <div class="input">
            <label for="mensagem">Mensagem:</label>
            <input class="fonte" type="text" name="mensagem" id="mensagem" placeholder="Tire suas duvidas aqui!">
        </div>
            <div class="form-esquerda-botao">
                <button class="enviar fonte" type="submit">Enviar</button>
            </div>
            

    </form>
