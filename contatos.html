        <div class="input">
            <label for="nome">Nome:</label>
            <input class="fonte" type="text" name="nome" id="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="input">

            <input class="fonte" type="email" name="email" id=email placeholder="Ex: ohmydog9@gmail.com" required>

            <input class="fonte" type="tel" name="telefone" id="telefone" placeholder="Ex: 99 555-444" required>
        </div>

        <div class="input">
            <label for="assunto">Assunto:</label>
            <input class="fonte" type="text" name="assunto" id="assunto" placeholder="Digite aqui o assunto!">

        <div class="input">
            <label for="mensagem">Mensagem:</label>
            <input class="fonte" type="text" name="mensagem" id="mensagem" placeholder="Explique o assunto!">
        </div>

        <div class="form-esquerda-botao">
            <button class="enviar fonte" type="submit">Enviar</button>
        </div>
    </form>
