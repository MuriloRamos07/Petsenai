<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Contatos HTML5">
    <meta name="keywords" content="Contatos, pet-shop, HTML, CSS">
    <meta name="author" content="Murilo Ramos">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/contatos.css">
    <title>Contatos do site Oh my dog!</title>
</head>

<body class="cor-fundo">
    <header class="cabecalho">
        <h1 class="fonte">OH</h1>
        <div class="texto-mydog fonte">
            <h2 class="texto-mydog fonte">MY</h2>
            <h2 class="texto-mydog fonte">DOG</h2>
        </div>
        <div class="ponto-exclamacao fonte">
            <h2 class="ponto-exclamacao fonte">!</h2>
        </div>
        <div class="perfil fonte">
            <a href="./login.html">PERFIL</a>
        </div>
    </header>

    <nav class="menu-superior">
        <ul>
            <li><a href="./index.html" class="fonte">HOME</a></li>
            <li><a href="./servicos.html" class="fonte">SERVIÇOS</a></li>
            <li><a href="./galeria.html" class="fonte">GALERIA</a></li>
            <li><a href="./contatos.html" class="fonte">ENTRE EM CONTATO</a></li>
        </ul>
    </nav>



    <div class="titulo-contato">
        <h3 class="cor-contato fonte">Entre em contato conosco:</h3>
    </div>

    <form class="entre-em-contato form-esquerda fonte-form" action="http://localhost:3001/Cadastrar" method="POST">

        <div class="input">
            <label for="NOME">Nome:</label>
            <input class="fonte" type="text" name="NOME" id="NOME" placeholder="Seu nome completo" required>
        </div>

        <div class="input">
            <label for="TELEFONE">Telefone:</label>
            <input class="fonte" type="tel" name="TELEFONE" id="TELEFONE" placeholder="Ex: 99 555-444" required>
        </div>

        <div class="input">
            <label for="EMAIL">E-mail:</label>
            <input class="fonte" type="EMAIL" name="EMAIL" id=EMAIL placeholder="Ex: ohmydog9@gmail.com" required>
        </div>

        <div class="input">
            <label for="ASSUNTO">Assunto:</label>
            <input class="fonte" type="text" name="ASSUNTO" id="ASSUNTO" placeholder="Digite aqui o assunto!" required>
        </div>

        <div class="input">
            <label for="MENSAGEM">Mensagem:</label>
            <textarea class="fonte" name="MENSAGEM" id="MENSAGEM" placeholder="Explique o assunto!"></textarea>
        </div>

        <div class="form-esquerda-botao">
            <button class="enviar fonte" type="submit">Enviar</button>
        </div>
    </form>

    <footer>
        <div class="rodape-caixa fonte2">
            <div class="coluna1 fonte2">
                <div>
                    <a href="./index.html"><img class="logotipo" src="./img/logotipo.png" alt="Logo do PetShop Oh My Dog"></a>

                </div>
            </div>

            <div class="coluna2">
                <h3 class="fonte2">Política: </h3>
                <h4>Termos e condições<br>Troca e devoluções<br>Privacidade<br>Compra segura<br>Frete <br> <br> <br>
                    <br>
                </h4>
            </div>

            <div class="coluna3">
                <h3 class="fonte2">Formas de pagamento:</h3>
                <h4>Cartão de débito<br>Cartão de crédito<br>Pix<br>Boletos bancário <br> <br> <br> <br> <br>
                </h4>
            </div>
            <br>
            <div class="coluna4">
                <h3 class="fonte2"><a href="./servicos.html">Sobre nós</a></h3>
            </div>
            <img class="imagem" src="./img/insta1.png" alt="logo-instagram">
            <img class="imagem" src="./img/face1.png" alt="logo-facebook">
            <img class="imagem" src="./img/tktk2.png" alt="logo-tiktok">
            <img class="imagem" src="./img/whats1.png" alt="logo-wtassapp">
        </div>
    </footer>

</body>

</html>
