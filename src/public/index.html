<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Tela de Login">
    <meta name="keywords" content="Login, Usuário">
    <meta name="author" content="Ricardo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Login</title>
</head>

<body>
    <div class="container">
        <form class="formulario" action="http://localhost:3001/login" method="POST">
            <h2>LOGIN</h2>

            <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu E-Mail*" required>
            </div>
            <div class="field">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua Senha*" required>
            </div>

            <input class="btnEntrar" type="submit" value="Entrar">

            <div>
                <p>Não tem uma conta? <a class="link" href="cadastro.html">Cadastre-se aqui</a></p>
            </div>
        </form>
    </div>
</body>
</html>
